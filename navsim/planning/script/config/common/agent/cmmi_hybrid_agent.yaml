_target_: navsim.agents.cmmi_hybrid_agent.CMMIHybridAgent
_convert_: 'all'

trajectory_sampling:
  _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
  _convert_: 'all'
  time_horizon: 4
  interval_length: 0.5

fudoki_path: "pretrained_model/fudoki"
cmmi_path: "pretrained_model/cmmi"         # cmmi no BEV token fine-tuning
bev_ckpt_path: "pretrained_model/bevfusion/bevfusion_lidar_nusc.pth"
seg_det_ckpt_path: "output/pretrain/seg_det/checkpoint-20000/model.safetensors"
text_embedding_path: "pretrained_model/fudoki/text_embedding.pt"
image_embedding_path: "pretrained_model/fudoki/image_embedding.pt"
heading_mlp_path: "pretrained_model/cmmi/best_model_epoch95.pt"

discrete_fm_steps: 5
seed: 99
dtype: default
bev_cache_dir: ""
